name: Lint

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - README.md
      - LICENSE
      - .github/ISSUE_TEMPLATE
      - .github/*.md
  workflow_dispatch:

jobs:
  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y podman libbtrfs-dev libgpgme-dev libgpgme-dev lxc-dev lxc
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
      - run: go vet ./...

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y yamllint
      - name: Run yamllint
        run: yamllint -d relaxed --no-warnings .

